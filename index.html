<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Bookmark Manager</h1>

    <nav>
        <a href="#all" id="nav-all">All Bookmarks</a>
        <a href="#add" id="nav-add">Add Bookmark</a>
    </nav>

    <div id="all-view" class="view">
        <h2>Saved Bookmarks</h2>
        <ul id="bookmark-list"></ul>
        <p id="empty-state" class="empty-message" style="display: none;">No bookmarks yet.</p>
    </div>

    <div id="add-view" class="view">
        <h2 id="form-title-heading">Add a New Bookmark</h2>
        <form id="bookmark-form">
            <input type="hidden" id="bookmark-index" value="">
            
            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" required placeholder="e.g., Google">
            </div>
            <div>
                <label for="url">URL:</label>
                <input type="url" id="url" required placeholder="https://www.google.com">
            </div>
            <div>
                <label for="category">Category:</label>
                <select id="category">
                    <option value="Reading">Reading</option>
                    <option value="Tools">Tools</option>
                    <option value="Recipes">Recipes</option>
                </select>
            </div>
            <button type="submit" id="submit-btn">Save Bookmark</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
